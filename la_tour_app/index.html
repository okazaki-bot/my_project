<html lang="ja">

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif;

        }

        header {

        }
        header h1 { font-size: 1.25rem; font-weight: 800; letter-spacing: 0.04em; }
        header .subtitle { font-size: 0.78rem; color: #9ab; margin-top: 4px; }

        .day-tabs {
            display: flex;
            overflow-x: auto;
            background: #162030;
            padding: 0 8px;
            scrollbar-width: none;
            border-bottom: 1px solid #0a1520;
        }
        .day-tabs::-webkit-scrollbar { display: none; }

        .day-tab {
            flex-shrink: 0;
            padding: 10px 14px;
            color: #6a8a9a;
            cursor: pointer;
            font-size: 0.75rem;
            border-bottom: 3px solid transparent;
            text-align: center;
            transition: all 0.2s;
        }
        .day-tab .dn { font-size: 0.9rem; font-weight: 800; display: block; }
        .day-tab .dd { font-size: 0.68rem; margin-top: 1px; }
        .day-tab:hover { color: #acd; }
        .day-tab.active { color: #fff; border-bottom-color: #4eb8ff; }

        .main {
            max-width: 680px;
            margin: 0 auto;
            padding: 18px 14px 40px;
        }

        .day-header {
            background: white;
            border-radius: 14px;
            padding: 16px 18px;
            margin-bottom: 18px;
            box-shadow: 0 1px 6px rgba(0,0,0,0.07);
        }
        .day-header h2 { font-size: 1.05rem; font-weight: 800; line-height: 1.4; }
        .day-header .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
        .badge {
            display: inline-flex; align-items: center; gap: 4px;
            font-size: 0.72rem; font-weight: 600;
            padding: 3px 10px; border-radius: 20px;
        }
        .badge-area { background: #e8f4ff; color: #1a6fa8; }
        .badge-hotel { background: #fff4e0; color: #a0600a; }

        .timeline { position: relative; }
        .timeline::before {
            content: '';
            position: absolute;
            left: 48px;
            top: 0; bottom: 0;
            width: 2px;
            background: linear-gradient(to bottom, #d0e8f8, #e8e8e8);
        }

        .event-card {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            position: relative;
        }
        .event-time {
            width: 48px;
            text-align: right;
            font-size: 0.72rem;
            font-weight: 700;
            color: #778;
            padding-top: 13px;
            flex-shrink: 0;
            line-height: 1.3;
        }
        .event-dot {
            width: 14px; height: 14px;
            border-radius: 50%;
            background: #4eb8ff;
            border: 3px solid #fff;
            box-shadow: 0 0 0 2px #4eb8ff;
            flex-shrink: 0;
            margin-top: 13px;
            z-index: 1;
        }
        .event-dot.dot-special { background: #ff5f3a; box-shadow: 0 0 0 2px #ff5f3a; }
        .event-dot.dot-meal    { background: #3cb371; box-shadow: 0 0 0 2px #3cb371; }
        .event-dot.dot-move    { background: #aaa;    box-shadow: 0 0 0 2px #aaa; }

        .event-body {
            flex: 1;
            background: white;
            border-radius: 12px;
            padding: 12px 14px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.07);
            transition: box-shadow 0.15s, transform 0.15s;
            min-width: 0;
        }
        .event-body.clickable { cursor: pointer; }
        .event-body.clickable:hover {
            box-shadow: 0 4px 14px rgba(0,0,0,0.13);
            transform: translateY(-1px);
        }

        .ev-head {
            display: flex; align-items: flex-start; gap: 7px; flex-wrap: wrap;
        }
        .ev-icon { font-size: 1.15rem; flex-shrink: 0; }
        .ev-title { font-weight: 700; font-size: 0.92rem; flex: 1; min-width: 0; }
        .ev-tag {
            font-size: 0.65rem; font-weight: 700;
            padding: 2px 8px; border-radius: 10px;
            white-space: nowrap; align-self: flex-start;
        }
        .t-arch  { background: #e8f4ff; color: #1a6fa8; }
        .t-spec  { background: #fff0eb; color: #c04010; }
        .t-meal  { background: #edfaf2; color: #1a7a40; }
        .t-move  { background: #f2f2f2; color: #555; }
        .t-free  { background: #f5eeff; color: #6a30a0; }
        .t-hotel { background: #fff8ea; color: #a06010; }

        .ev-desc {
            font-size: 0.8rem; color: #555;
            margin-top: 6px; line-height: 1.55;
        }
        .ev-loc {
            font-size: 0.72rem; color: #3a8fd4;
            margin-top: 6px; display: flex; align-items: center; gap: 3px;
        }
        .ev-hint {
            font-size: 0.7rem; color: #aaa;
            margin-top: 5px; display: flex; align-items: center; gap: 3px;
        }

        /* Modal */
        .overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.55); z-index: 1000;
            backdrop-filter: blur(3px);
            align-items: flex-end; justify-content: center;
        }
        .overlay.open { display: flex; }
        @media (min-width: 580px) { .overlay.open { align-items: center; } }

        .modal {
            background: white; width: 100%; max-width: 520px;
            border-radius: 22px 22px 0 0;
            padding: 24px 20px 32px;
            max-height: 88vh; overflow-y: auto;
            animation: slideUp 0.22s ease;
        }
        @media (min-width: 580px) { .modal { border-radius: 20px; } }

        @keyframes slideUp {
            from { transform: translateY(24px); opacity: 0; }
            to   { transform: translateY(0);    opacity: 1; }
        }

        .modal-handle {
            width: 36px; height: 4px; background: #ddd;
            border-radius: 2px; margin: 0 auto 18px;
        }
        .modal-head {
            display: flex; align-items: flex-start; gap: 10px; margin-bottom: 14px;
        }
        .modal-icon-wrap {
            font-size: 2rem; line-height: 1;
            background: #f5f5f5; border-radius: 12px;
            padding: 8px; flex-shrink: 0;
        }
        .modal-title { font-size: 1.1rem; font-weight: 800; line-height: 1.3; }
        .modal-time-tag { display: flex; align-items: center; gap: 6px; margin-top: 5px; }
        .modal-time-text { font-size: 0.78rem; color: #777; }
        .modal-close {
            margin-left: auto; background: #f0f0f0;
            border: none; font-size: 1rem; cursor: pointer;
            color: #666; padding: 6px 10px; border-radius: 20px;
            font-weight: 700; flex-shrink: 0;
        }

        .m-divider { height: 1px; background: #eee; margin: 14px 0; }

        .m-section { margin-bottom: 14px; }
        .m-section h3 {
            font-size: 0.7rem; font-weight: 800; color: #999;
            text-transform: uppercase; letter-spacing: 0.08em;
            margin-bottom: 6px;
        }
        .m-section p {
            font-size: 0.87rem; line-height: 1.65; color: #333;
        }
        .arch-pills {
            display: flex; flex-wrap: wrap; gap: 6px;
        }
        .arch-pill {
            background: #f0f6ff; border: 1px solid #cce; color: #336;
            font-size: 0.72rem; padding: 3px 10px; border-radius: 20px;
        }

        .map-frame {
            width: 100%; height: 220px;
            border: none; border-radius: 14px;
            margin-top: 18px;
            display: block;
        }
    </style>
</head>

let activeDay = 0;

function buildTabs() {
    const el = document.getElementById('dayTabs');
    DAYS.forEach((d, i) => {
        const tab = document.createElement('div');
        tab.className = 'day-tab' + (i === 0 ? ' active' : '');
        tab.innerHTML = `<span class="dn">${d.label}</span><span class="dd">${d.date}</span>`;
        tab.addEventListener('click', () => selectDay(i));
        el.appendChild(tab);
    });
}

function selectDay(i) {
    activeDay = i;
    document.querySelectorAll('.day-tab').forEach((t, j) => t.classList.toggle('active', j === i));
    const tab = document.querySelector(`.day-tab:nth-child(${i + 1})`);
    if (tab) tab.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    renderDay(DAYS[i]);
}

function renderDay(d) {
    const hdr = document.getElementById('dayHeader');
    hdr.innerHTML = `
        <h2>${d.fullDate}　${d.title}</h2>
        <div class="badges">
            <span class="badge badge-area">📍 ${d.area}</span>
            <span class="badge badge-hotel">🏨 ${d.hotel}</span>
        </div>`;

    const tl = document.getElementById('timeline');
    tl.innerHTML = '';

    d.events.forEach(ev => {
        const cfg = TAG[ev.tag] || TAG.free;
        const clickable = ev.hasMap || ev.detail;
        const card = document.createElement('div');
        card.className = 'event-card';
        card.innerHTML = `
            <div class="event-time">${ev.time}</div>
            <div class="event-dot ${cfg.dot}"></div>
            <div class="event-body${clickable ? ' clickable' : ''}">
                <div class="ev-head">
                    <span class="ev-icon">${ev.icon}</span>
                    <span class="ev-title">${ev.title}</span>
                    <span class="ev-tag ${cfg.cls}">${cfg.label}</span>
                </div>
                <div class="ev-desc">${ev.desc}</div>
                ${ev.hasMap && ev.loc ? `<div class="ev-loc">📍 ${ev.loc}</div>` : ''}
                ${clickable ? `<div class="ev-hint">👆 タップして詳細・地図を見る</div>` : ''}
            </div>`;
        if (clickable) card.querySelector('.event-body').addEventListener('click', () => openModal(ev));
        tl.appendChild(card);
    });
}

function openModal(ev) {
    const cfg = TAG[ev.tag] || TAG.free;
    const modal = document.getElementById('modal');

    let archBlock = '';
    if (ev.architect) {
        archBlock = `
            <div class="m-section">
                <h3>建築情報</h3>
                <div class="arch-pills">
                    <span class="arch-pill">🏗 ${ev.architect}</span>
                    <span class="arch-pill">📅 ${ev.year}</span>
                    <span class="arch-pill">🎨 ${ev.style}</span>
                </div>
            </div>
            <div class="m-divider"></div>`;
    }

    let detailBlock = '';
    if (ev.detail) {
        detailBlock = `
            <div class="m-section">
                <h3>詳細・視察ポイント</h3>
                <p>${ev.detail.replace(/\n/g, '<br>')}</p>
            </div>
            <div class="m-divider"></div>`;
    }

    let mapBtn = '';
    if (ev.hasMap && ev.addr) {
        const q = encodeURIComponent(ev.addr);
        const src = `https://maps.google.com/maps?q=${q}&output=embed&hl=ja`;
        mapBtn = `<div class="m-section"><h3>地図</h3></div>
        <iframe class="map-frame" src="${src}" allowfullscreen loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>`;
    }

    modal.innerHTML = `
        <div class="modal-handle"></div>
        <div class="modal-head">
            <div class="modal-icon-wrap">${ev.icon}</div>
            <div>
                <div class="modal-title">${ev.title}</div>
                <div class="modal-time-tag">
                    <span class="modal-time-text">${ev.time}</span>
                    <span class="ev-tag ${cfg.cls}">${cfg.label}</span>
                </div>
            </div>
            <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
        <div class="m-divider"></div>
        ${archBlock}
        <div class="m-section">
            <h3>概要</h3>
            <p>${ev.desc}</p>
        </div>
        <div class="m-divider"></div>
        ${detailBlock}
        ${ev.hasMap && ev.loc ? `
        <div class="m-section">
            <h3>場所</h3>
            <p>📍 ${ev.loc}</p>
        </div>` : ''}
        ${mapBtn}`;

    document.getElementById('overlay').classList.add('open');
}

function closeModal() {
    document.getElementById('overlay').classList.remove('open');
}

document.getElementById('overlay').addEventListener('click', e => {
    if (e.target === document.getElementById('overlay')) closeModal();
});

buildTabs();
renderDay(DAYS[0]);
</script>
